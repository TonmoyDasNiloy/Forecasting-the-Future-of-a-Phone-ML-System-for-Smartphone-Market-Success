<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="1210" xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, Helvetica, sans-serif">

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 0 1 L 9 5 L 0 9 z" fill="#222"/>
  </marker>
</defs>

<!-- ═══ WHITE BACKGROUND ═══ -->
<rect width="820" height="1210" fill="white"/>

<!-- ═══ TITLE ═══ -->
<text x="410" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Smartphone BI Agent — Activity Diagram</text>
<line x1="55" y1="40" x2="765" y2="40" stroke="#bbb" stroke-width="1"/>

<!-- ═══ LEFT-MARGIN SECTION BRACKETS ═══ -->

<!-- USER INPUT bracket: y=68 to y=300 -->
<line x1="30" y1="68"  x2="44" y2="68"  stroke="#888" stroke-width="1.5"/>
<line x1="30" y1="300" x2="44" y2="300" stroke="#888" stroke-width="1.5"/>
<line x1="30" y1="68"  x2="30" y2="300" stroke="#888" stroke-width="1.5"/>
<text x="19" y="184" text-anchor="middle" font-size="8" font-weight="bold" fill="#555"
      transform="rotate(-90,19,184)">USER INPUT</text>

<!-- AI PIPELINE bracket: y=344 to y=726 -->
<line x1="30" y1="344" x2="44" y2="344" stroke="#2563eb" stroke-width="1.5"/>
<line x1="30" y1="726" x2="44" y2="726" stroke="#2563eb" stroke-width="1.5"/>
<line x1="30" y1="344" x2="30" y2="726" stroke="#2563eb" stroke-width="1.5"/>
<text x="19" y="535" text-anchor="middle" font-size="8" font-weight="bold" fill="#2563eb"
      transform="rotate(-90,19,535)">AI PIPELINE</text>

<!-- OUTPUT bracket: y=768 to y=1108 -->
<line x1="30" y1="768"  x2="44" y2="768"  stroke="#166534" stroke-width="1.5"/>
<line x1="30" y1="1108" x2="44" y2="1108" stroke="#166534" stroke-width="1.5"/>
<line x1="30" y1="768"  x2="30" y2="1108" stroke="#166534" stroke-width="1.5"/>
<text x="19" y="938" text-anchor="middle" font-size="8" font-weight="bold" fill="#166534"
      transform="rotate(-90,19,938)">OUTPUT</text>

<!-- ═══ START NODE ═══ -->
<circle cx="410" cy="68" r="16" fill="#111"/>
<text x="438" y="73" font-size="10" fill="#666" font-style="italic">start</text>

<!-- Arrow: start → box 1 -->
<line x1="410" y1="84" x2="410" y2="104" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─── Box 1: Enter Phone Specifications ─── -->
<rect x="168" y="104" width="464" height="52" rx="10"
      fill="#f3f4f6" stroke="#333" stroke-width="1.5"/>
<text x="400" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Enter Phone Specifications</text>
<text x="400" y="146" text-anchor="middle" font-size="11" fill="#444">Brand · Model · Region · Price · All hardware specs via sidebar</text>

<!-- Arrow -->
<line x1="410" y1="156" x2="410" y2="176" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─── Box 2: Click Analyze ─── -->
<rect x="198" y="176" width="404" height="44" rx="10"
      fill="#f3f4f6" stroke="#333" stroke-width="1.5"/>
<text x="400" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Click "Analyze This Phone"</text>
<text x="400" y="212" text-anchor="middle" font-size="11" fill="#444">Trigger POST /api/analyze  →  FastAPI backend (port 8000)</text>

<!-- Arrow -->
<line x1="410" y1="220" x2="410" y2="240" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─── Box 3: Validate and Feature Engineering ─── -->
<rect x="168" y="240" width="464" height="44" rx="10"
      fill="#f3f4f6" stroke="#333" stroke-width="1.5"/>
<text x="400" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Validate Input and Apply Feature Engineering</text>
<text x="400" y="276" text-anchor="middle" font-size="11" fill="#444">Derive: perf_score · value_score · pixels · battery_per_inch · cam_total</text>

<!-- Arrow: box 3 → Pillar 1 (gap for visual breathing room) -->
<line x1="410" y1="284" x2="410" y2="344" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─── Box 4: Pillar 1 ─── -->
<rect x="138" y="344" width="524" height="62" rx="10"
      fill="#eff6ff" stroke="#333" stroke-width="1.5"/>
<rect x="145" y="350" width="38" height="18" rx="4" fill="#2563eb"/>
<text x="164" y="363" text-anchor="middle" font-size="9" font-weight="bold" fill="white">P1</text>
<text x="415" y="371" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Pillar 1 — Market Research</text>
<text x="415" y="390" text-anchor="middle" font-size="11" fill="#444">Classify market segment (XGBoost · Accuracy 99.4%) · Retrieve K nearest phones (KNN)</text>

<!-- Arrow -->
<line x1="410" y1="406" x2="410" y2="426" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─── Box 5: Pillar 2 ─── -->
<rect x="138" y="426" width="524" height="62" rx="10"
      fill="#eff6ff" stroke="#333" stroke-width="1.5"/>
<rect x="145" y="432" width="38" height="18" rx="4" fill="#2563eb"/>
<text x="164" y="445" text-anchor="middle" font-size="9" font-weight="bold" fill="white">P2</text>
<text x="415" y="453" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Pillar 2 — Demand Forecasting</text>
<text x="415" y="472" text-anchor="middle" font-size="11" fill="#444">6-month unit demand curve · XGBoost Regressor · Cold-start only (R² = 0.854)</text>

<!-- Arrow -->
<line x1="410" y1="488" x2="410" y2="508" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─── Box 6: Pillar 3 ─── -->
<rect x="138" y="508" width="524" height="62" rx="10"
      fill="#eff6ff" stroke="#333" stroke-width="1.5"/>
<rect x="145" y="514" width="38" height="18" rx="4" fill="#2563eb"/>
<text x="164" y="527" text-anchor="middle" font-size="9" font-weight="bold" fill="white">P3</text>
<text x="415" y="535" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Pillar 3 — Customer Segmentation</text>
<text x="415" y="554" text-anchor="middle" font-size="11" fill="#444">Retrieve buyer demographics (Age · Income · RFM) from K similar phones</text>

<!-- Arrow -->
<line x1="410" y1="570" x2="410" y2="590" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─── Box 7: Pillar 4 ─── -->
<rect x="138" y="590" width="524" height="62" rx="10"
      fill="#eff6ff" stroke="#333" stroke-width="1.5"/>
<rect x="145" y="596" width="38" height="18" rx="4" fill="#2563eb"/>
<text x="164" y="609" text-anchor="middle" font-size="9" font-weight="bold" fill="white">P4</text>
<text x="415" y="617" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Pillar 4 — Product-Market Fit and Failure Risk</text>
<text x="415" y="636" text-anchor="middle" font-size="11" fill="#444">Construct PMF score · Random Forest failure classifier (AUC = 0.88)</text>

<!-- Arrow -->
<line x1="410" y1="652" x2="410" y2="672" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─── Box 8: Compute CLV ─── -->
<rect x="195" y="672" width="430" height="44" rx="10"
      fill="#eff6ff" stroke="#333" stroke-width="1.5"/>
<text x="410" y="692" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Compute Customer Lifetime Value (Live)</text>
<text x="410" y="708" text-anchor="middle" font-size="11" fill="#444">net_price × margin(18%) × repeat_factor × loyalty_horizon(2.4)</text>

<!-- Arrow: CLV → Assemble (gap for section breathing room) -->
<line x1="410" y1="716" x2="410" y2="768" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─── Box 9: Assemble Dashboard ─── -->
<rect x="198" y="768" width="404" height="44" rx="10"
      fill="#f0fdf4" stroke="#333" stroke-width="1.5"/>
<text x="400" y="788" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Assemble BI Dashboard Results</text>
<text x="400" y="804" text-anchor="middle" font-size="11" fill="#444">Merge outputs: Market Position · Demand Curve · Demographics · PMF · CLV</text>

<!-- Arrow → Decision diamond -->
<line x1="410" y1="812" x2="410" y2="836" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─── Decision Diamond ───
     Center: (410, 882)   half-width: 132   half-height: 46
     top=(410,836)  right=(542,882)  bottom=(410,928)  left=(278,882)
-->
<polygon points="410,836 542,882 410,928 278,882"
         fill="#fffbeb" stroke="#333" stroke-width="1.5"/>
<text x="410" y="876" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">PMF Failure</text>
<text x="410" y="893" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Risk Level?</text>

<!-- Branch condition labels -->
<text x="194" y="864" text-anchor="middle" font-size="9" fill="#555" font-style="italic">risk &lt; 20%</text>
<text x="460" y="945" text-anchor="start"  font-size="9" fill="#555" font-style="italic">20 – 40%</text>
<text x="610" y="864" text-anchor="middle" font-size="9" fill="#555" font-style="italic">risk &gt; 40%</text>

<!-- ─── Left branch: GO FOR LAUNCH ─── -->
<polyline points="278,882 125,882 125,956"
          stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<rect x="50" y="956" width="150" height="52" rx="8"
      fill="#dcfce7" stroke="#333" stroke-width="1.5"/>
<text x="125" y="978" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">GO FOR</text>
<text x="125" y="995" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">LAUNCH</text>

<!-- ─── Center branch: CAUTION ─── -->
<line x1="410" y1="928" x2="410" y2="956" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="335" y="956" width="150" height="52" rx="8"
      fill="#fffbeb" stroke="#333" stroke-width="1.5"/>
<text x="410" y="978" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">CAUTION</text>
<text x="410" y="995" text-anchor="middle" font-size="11" fill="#555">Review and Refine</text>

<!-- ─── Right branch: RECONSIDER ─── -->
<polyline points="542,882 695,882 695,956"
          stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<rect x="620" y="956" width="150" height="52" rx="8"
      fill="#fef2f2" stroke="#333" stroke-width="1.5"/>
<text x="695" y="978" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">RECONSIDER</text>
<text x="695" y="995" text-anchor="middle" font-size="11" fill="#555">High Risk</text>

<!-- Merge lines (branch boxes bottom: y = 956+52 = 1008) -->
<line x1="125" y1="1008" x2="125" y2="1040" stroke="#222" stroke-width="1.5"/>
<line x1="410" y1="1008" x2="410" y2="1040" stroke="#222" stroke-width="1.5"/>
<line x1="695" y1="1008" x2="695" y2="1040" stroke="#222" stroke-width="1.5"/>
<!-- Merge bar (thick horizontal) -->
<line x1="125" y1="1040" x2="695" y2="1040" stroke="#222" stroke-width="4"/>
<!-- Arrow from merge bar down -->
<line x1="410" y1="1042" x2="410" y2="1062" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ─── Box 10: Display Full Dashboard ─── -->
<rect x="168" y="1062" width="464" height="52" rx="10"
      fill="#f0fdf4" stroke="#333" stroke-width="1.5"/>
<text x="400" y="1085" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Display Full BI Dashboard to User</text>
<text x="400" y="1104" text-anchor="middle" font-size="11" fill="#444">KPI cards · Demand chart · Donut charts · PMF gauge · Competitor list · JSON</text>

<!-- Arrow → End -->
<line x1="410" y1="1114" x2="410" y2="1142" stroke="#222" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ═══ END NODE ═══ -->
<circle cx="410" cy="1160" r="16" fill="white" stroke="#111" stroke-width="2.5"/>
<circle cx="410" cy="1160" r="9"  fill="#111"/>
<text x="438" y="1165" font-size="10" fill="#666" font-style="italic">end</text>

<!-- ═══ LEGEND ═══ -->
<line x1="55" y1="1186" x2="765" y2="1186" stroke="#ccc" stroke-width="1"/>
<rect x="58"  y="1191" width="12" height="12" rx="3" fill="#f3f4f6" stroke="#333" stroke-width="1"/>
<text x="74"  y="1202" font-size="10" fill="#333">User Input</text>
<rect x="148" y="1191" width="12" height="12" rx="3" fill="#eff6ff" stroke="#333" stroke-width="1"/>
<text x="164" y="1202" font-size="10" fill="#333">AI Pipeline (P1–P4)</text>
<rect x="278" y="1191" width="12" height="12" rx="3" fill="#f0fdf4" stroke="#333" stroke-width="1"/>
<text x="294" y="1202" font-size="10" fill="#333">Output</text>
<polygon points="382,1197 394,1203 382,1203 370,1197"
         fill="#fffbeb" stroke="#333" stroke-width="1"/>
<text x="398" y="1202" font-size="10" fill="#333">Decision</text>
<rect x="474" y="1191" width="12" height="12" rx="3" fill="#dcfce7" stroke="#333" stroke-width="1"/>
<text x="490" y="1202" font-size="10" fill="#333">GO FOR LAUNCH</text>
<rect x="594" y="1191" width="12" height="12" rx="3" fill="#fffbeb" stroke="#333" stroke-width="1"/>
<text x="610" y="1202" font-size="10" fill="#333">CAUTION</text>
<rect x="672" y="1191" width="12" height="12" rx="3" fill="#fef2f2" stroke="#333" stroke-width="1"/>
<text x="688" y="1202" font-size="10" fill="#333">RECONSIDER</text>

</svg>
