<rect x="300" y="58" width="1100" height="1" fill="#1f2937"/>
<!-- Logo in top bar -->
<circle cx="330" cy="29" r="16" fill="#1e1b4b"/>
<text x="330" y="34" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle">BI</text>
<text x="356" y="23" fill="#f1f5f9" font-size="12" font-weight="900">Product Launch</text>
<text x="356" y="23" fill="#f1f5f9" font-size="12" font-weight="900"> </text>
<!-- gradient "Intelligence" text -->
<text x="490" y="23" fill="#818cf8" font-size="12" font-weight="900">Intelligence</text>
<text x="572" y="23" fill="#f1f5f9" font-size="12" font-weight="900"> Dashboard</text>
