<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg" font-family="Inter,-apple-system,sans-serif">
<defs>
  <linearGradient id="btn2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>
  <radialGradient id="orb-core" cx="35%" cy="30%" r="65%">
    <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
    <stop offset="35%" stop-color="#6366f1" stop-opacity="0.8"/>
    <stop offset="70%" stop-color="#0ea5e9" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.5"/>
  </radialGradient>
  <radialGradient id="orb-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orb-shine" cx="38%" cy="28%" r="40%">
    <stop offset="0%" stop-color="white" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="white" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow-filter">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>

<!-- Background -->
<rect width="1400" height="900" fill="#0b0d14"/>

