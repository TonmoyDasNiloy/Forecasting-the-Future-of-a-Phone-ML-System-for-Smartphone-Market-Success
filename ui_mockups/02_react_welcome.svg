<text x="1358" y="33" fill="#94a3b8" font-size="10" text-anchor="middle">☀ Light</text>

<!-- Empty state: Siri orb -->
<!-- Glow halo (outermost) -->
<circle cx="850" cy="430" r="148" fill="url(#orb-glow)"/>

<!-- Ripple ring 1 -->
<circle cx="850" cy="430" r="135" fill="none" stroke="#818cf8" stroke-width="2.5" opacity="0.55"/>
<!-- Ripple ring 2 (offset) -->
<circle cx="850" cy="430" r="135" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.40"/>

<!-- Orb shadow/depth -->
<circle cx="850" cy="430" r="108" fill="#1e1b4b" opacity="0.7"/>

<!-- Orb layer 1: main conic-like gradient using overlapping arcs -->
<circle cx="850" cy="430" r="105" fill="#6366f1" opacity="0.7"/>
<!-- Color wash layers -->
<ellipse cx="820" cy="400" rx="80" ry="70" fill="#a855f7" opacity="0.55"/>
<ellipse cx="880" cy="460" rx="75" ry="65" fill="#0ea5e9" opacity="0.45"/>
<ellipse cx="870" cy="400" rx="60" ry="50" fill="#ec4899" opacity="0.30"/>
<ellipse cx="830" cy="450" rx="55" ry="48" fill="#22d3ee" opacity="0.35"/>

<!-- Shine highlight -->
<ellipse cx="820" cy="400" rx="48" ry="36" fill="white" opacity="0.42"/>

<!-- Inner clip mask effect (darkens outer) -->
<circle cx="850" cy="430" r="105" fill="none" stroke="#0b0d14" stroke-width="2"/>

<!-- Box shadow glow -->
<circle cx="850" cy="430" r="105" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.7" filter="url(#glow-filter)"/>

<!-- Welcome text below orb -->
<text x="850" y="594" fill="#f1f5f9" font-size="20" font-weight="700" text-anchor="middle">Enter specs in the sidebar and click Analyze</text>
<text x="850" y="618" fill="#64748b" font-size="13" text-anchor="middle">The agent predicts market segment, demand curve, customer demographics,</text>
<text x="850" y="636" fill="#64748b" font-size="13" text-anchor="middle">PMF score, and CLV — plus fetches live news, reviews, and competitor articles.</text>
